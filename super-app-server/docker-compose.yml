version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: super_app_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: superapp_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: super_app_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: super_app_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - '8080:80'
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    container_name: super_app_mailpit
    restart: always
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # HTTP Web UI port

volumes:
  postgres_data:
  redis_data:
